name: zinecore2

services:

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-zinecore}
      POSTGRES_USER: ${DATABASE_USER:-zinecore}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-zinecore_dev}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-zinecore}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
