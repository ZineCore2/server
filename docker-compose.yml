services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: zinecore
      POSTGRES_USER: zinecore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zinecore_dev}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zinecore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
